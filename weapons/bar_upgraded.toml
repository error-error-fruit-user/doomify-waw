# The Widow Maker: Der Riese's zombie_bar_upgraded. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "The Widow Maker"
class = "WidowMaker"
sprite = "B1"
kind = "bullet"
slot = 5
upgraded = true

[game]
weapon = "zombie_bar_upgraded"
models = ["viewmodel_hands", "viewmodel_zombie_bar_lmg_up"]
world = "weapon_zombie_bar_lmg_up"

[ammo]
magazine = 30
reserve = 150
give = 150

[fire]
auto = true
time = 0.11
damage = 200
spread = 3.0
ads_spread = 0.8

[animations]
idle = "viewmodel_bar_idle"
empty_idle = "viewmodel_bar_idle_empty"
fire = "viewmodel_bar_fire"
last_fire = "viewmodel_bar_lastshot"
ads_fire = "viewmodel_bar_ads_fire"
ads_last_fire = "viewmodel_bar_lastshot"
reload = "viewmodel_bar_reload"
reload_empty = "viewmodel_bar_reload_empty"
raise = "viewmodel_bar_pullout"
first_raise = "viewmodel_bar_pullout"
drop = "viewmodel_bar_putaway"
ads_up = "viewmodel_bar_ads_up"
ads_down = "viewmodel_bar_ads_down"

[sounds]
fire = "weap_bar_fire_ubershot_st"
last_fire = "weap_bar_fire_ubershot_st"
dry = "dryfire_rifle_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"

[view]
ads_fov = 55
