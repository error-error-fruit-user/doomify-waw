# Gibs-o-matic: Der Riese's zombie_thompson_upgraded. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "Gibs-o-matic"
class = "GibsOMatic"
sprite = "T1"
kind = "bullet"
slot = 3
upgraded = true

[game]
weapon = "zombie_thompson_upgraded"
models = ["viewmodel_hands", "viewmodel_zombie_thompson_smg_up"]
world = "weapon_zombie_thompson_smg_up"

[ammo]
magazine = 40
reserve = 210
give = 210

[fire]
auto = true
time = 0.065
damage = 200
spread = 3.0
ads_spread = 1.0

[animations]
idle = "viewmodel_thompson_idle"
empty_idle = "viewmodel_thompson_idle_empty"
fire = "viewmodel_thompson_fire"
last_fire = "viewmodel_thompson_lastshot"
ads_fire = "viewmodel_thompson_fire_ads"
ads_last_fire = "viewmodel_thompson_fire_ads"
reload = "viewmodel_thompson_reload"
reload_empty = "viewmodel_thompson_reload_empty"
raise = "viewmodel_thompson_pullout"
first_raise = "viewmodel_thompson_pullout"
drop = "viewmodel_thompson_putaway"
ads_up = "viewmodel_thompson_ads_up"
ads_down = "viewmodel_thompson_ads_down"

[sounds]
fire = "weap_thompson_fire_ubershot_st"
dry = "dryfire_smg_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"

[view]
ads_fov = 55
