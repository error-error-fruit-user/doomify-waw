# C-3000 b1at-ch35: Der Riese's zombie_colt_upgraded. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "C-3000 b1at-ch35"
class = "MustangAndSally"
sprite = "C1"
kind = "projectile"
slot = 1
upgraded = true
last_stand = 3

[game]
weapon = "zombie_colt_upgraded"
models = ["viewmodel_hands", "viewmodel_zombie_colt45_pistol_up"]
world = "weapon_zombie_colt45_pistol_up"

[ammo]
magazine = 6
reserve = 34
give = 34

[fire]
# Full Auto in World at War: holding the trigger keeps firing
auto = true
time = 0.8
damage = 1000
splash = 96
speed = 30
color = "ffcc44"

[animations]
idle = "viewmodel_colt45_idle"
empty_idle = "viewmodel_colt45_idle_empty"
fire = "viewmodel_colt45_fire"
last_fire = "viewmodel_colt45_lastshot"
ads_fire = "viewmodel_colt45_ads_fire"
ads_last_fire = "viewmodel_colt45_lastshot"
reload = "viewmodel_colt45_reload_notempty"
raise = "viewmodel_colt45_pullout"
first_raise = "viewmodel_colt45_pullout"
drop = "viewmodel_colt45_putaway"
ads_up = "viewmodel_colt45_ads_up"
ads_down = "viewmodel_colt45_ads_down"

[sounds]
fire = "weap_m1gren_fire_plr"
last_fire = "weap_m1gren_fire_plr"
dry = "dryfire_rifle_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"
impact = "grenade_explode"

[view]
ads_fov = 55

# Doom's rocket and its explosion, from the IWAD
[projectile]
sprite = "MISL"
scale = 0.5
burst = { sprite = "MISL", frames = "BCD" }
