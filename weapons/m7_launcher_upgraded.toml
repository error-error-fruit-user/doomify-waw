# The Imploder: Der Riese's m7_launcher_zombie_upgraded. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "The Imploder"
class = "RifleGrenadeUpgraded"
sprite = "R1"
kind = "projectile"
slot = 6
upgraded = true

[game]
weapon = "m7_launcher_zombie_upgraded"
models = ["viewmodel_hands", "viewmodel_zombie_m1garand_rifle_grenade_up"]
world = "weapon_zombie_m1garand_rifle_grenade_up"

[ammo]
magazine = 3
reserve = 37
give = 37

[fire]
# Full Auto in World at War: holding the trigger keeps firing
auto = true
time = 0.5
damage = 1000
splash = 256
speed = 28
color = "c070ff"

[animations]
idle = "viewmodel_m1garand_grenade_idle"
empty_idle = "viewmodel_m1garand_grenade_idle_empty"
fire = "viewmodel_m1garand_grenade_fire"
last_fire = "viewmodel_m1garand_grenade_fire"
ads_fire = "viewmodel_m1garand_grenade_fire"
ads_last_fire = "viewmodel_m1garand_grenade_fire"
reload = "viewmodel_m1garand_grenade_reload"
raise = "viewmodel_m1garand_grenade_pullout"
first_raise = "viewmodel_m1garand_grenade_first_pullout"
drop = "viewmodel_m1garand_grenade_putaway"
empty_raise = "viewmodel_m1garand_grenade_pullout_empty"
empty_drop = "viewmodel_m1garand_grenade_putaway_empty"
ads_up = "viewmodel_m1garand_grenade_ads_up"
ads_down = "viewmodel_m1garand_grenade_ads_down"

[sounds]
fire = "weap_m1gren_fire_plr"
last_fire = "weap_m1gren_fire_plr"
dry = "dryfire_rifle_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"
impact = "grenade_explode"

[view]
ads_fov = 50

# Doom's rocket and its explosion, from the IWAD
[projectile]
sprite = "MISL"
scale = 0.6
burst = { sprite = "MISL", frames = "BCD" }
