# The Reaper: Der Riese's zombie_ppsh_upgraded. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "The Reaper"
class = "PpshUpgraded"
sprite = "P2"
kind = "bullet"
slot = 3
upgraded = true

[game]
weapon = "zombie_ppsh_upgraded"
models = ["viewmodel_hands", "viewmodel_zombie_ppsh_smg_up"]
world = "weapon_zombie_ppsh_smg_up"

[ammo]
magazine = 115
reserve = 585
give = 585

[fire]
auto = true
time = 0.038
damage = 150
spread = 3.5
ads_spread = 1.2

[animations]
idle = "viewmodel_ppsh_idle"
empty_idle = "viewmodel_ppsh_idle_empty"
fire = "viewmodel_ppsh_fire"
last_fire = "viewmodel_ppsh_lastshot"
ads_fire = "viewmodel_ppsh_fire"
ads_last_fire = "viewmodel_ppsh_fire"
reload = "viewmodel_ppsh_reload_notempty"
reload_empty = "viewmodel_ppsh_reload"
raise = "viewmodel_ppsh_pullout"
first_raise = "viewmodel_ppsh_pullout"
drop = "viewmodel_ppsh_putaway"
empty_raise = "viewmodel_ppsh_pullout_empty"
empty_drop = "viewmodel_ppsh_putaway_empty"
ads_up = "viewmodel_ppsh_ads_up"
ads_down = "viewmodel_ppsh_ads_down"

[sounds]
fire = "weap_ppsh_fire_ubershot_st"
last_fire = "weap_ppsh_fire_ubershot_st"
dry = "dryfire_smg_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"

[view]
ads_fov = 55
