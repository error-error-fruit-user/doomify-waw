# Quick Revive: Der Riese's zombie_perk_bottle_revive, drunk as the game drinks it. The map's own machine
# sells it (its drink is the class <prefix>_QuickReviveDrink).
name = "Quick Revive"
class = "QuickRevive"
sprite = "QR"
kind = "drink"
perk = "QuickRevive"

[game]
weapon = "zombie_perk_bottle_revive"
models = ["viewmodel_hands", "zombie_perk_bottle_revive"]
world = "zombie_3rd_perk_bottle_revive"

[fire]
time = 2

[animations]
idle = "viewmodel_zombie_perksacola_idle"
raise = "viewmodel_zombie_perksacola_drink"
drop = "viewmodel_zombie_perksacola_lower"
