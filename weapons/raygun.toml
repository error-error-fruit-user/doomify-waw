# Ray Gun: Der Riese's ray_gun. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "Ray Gun"
class = "RayGun"
sprite = "RY"
kind = "projectile"
slot = 7
upgrade = "raygun_upgraded"
box_weight = 1
last_stand = 5

[game]
weapon = "ray_gun"
models = ["viewmodel_hands", "viewmodel_usa_ray_gun"]
world = "weapon_usa_ray_gun"

[ammo]
magazine = 20
reserve = 140
give = 140

[fire]
# Full Auto in World at War: holding the trigger keeps firing
auto = true
time = 0.33
damage = 1000
splash = 64
speed = 40
color = "6cff3a"

[animations]
idle = "viewmodel_ray_gun_idle"
empty_idle = "viewmodel_ray_gun_idle"
fire = "viewmodel_ray_gun_fire"
last_fire = "viewmodel_ray_gun_fire"
ads_fire = "viewmodel_ray_gun_fire"
ads_last_fire = "viewmodel_ray_gun_fire"
reload = "viewmodel_ray_gun_reload"
raise = "viewmodel_ray_gun_raise"
first_raise = "viewmodel_ray_gun_raise"
drop = "viewmodel_ray_gun_drop"
ads_up = "viewmodel_ray_gun_ads_up"
ads_down = "viewmodel_ray_gun_ads_down"

[sounds]
fire = "weap_rgun_fire_plr"
last_fire = "weap_rgun_fire_plr"
dry = "dryfire_pistol_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"
projectile = "weap_rgun_loop"
impact = "weap_rgun_exp"

[view]
ads_fov = 55

# ZDL's Ray Gun bolt (the map's RAYL and RAYX sprites), growing and shrinking as it flies
[projectile]
sprite = "RAYL"
scale = 0.25
pulse = true
burst = { sprite = "RAYX", frames = "ABCDE", scale = 1.728 }
