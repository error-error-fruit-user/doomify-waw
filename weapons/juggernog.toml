# Juggernog: Der Riese's zombie_perk_bottle_jugg, drunk as the game drinks it. The map's own machine
# sells it (its drink is the class <prefix>_JuggernogDrink).
name = "Juggernog"
class = "Juggernog"
sprite = "JN"
kind = "drink"
perk = "Juggernog"

[game]
weapon = "zombie_perk_bottle_jugg"
