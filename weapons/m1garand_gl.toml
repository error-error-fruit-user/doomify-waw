# M1 Garand w/ Launcher: Der Riese's m1garand_gl_zombie. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "M1 Garand w/ Launcher"
class = "M1GarandLauncher"
sprite = "GL"
kind = "bullet"
slot = 2
upgrade = "m1garand_gl_upgraded"
box_weight = 1

[game]
weapon = "m1garand_gl_zombie"
models = ["viewmodel_hands", "viewmodel_zombie_m1garand_rifle"]
world = "weapon_zombie_m1garand_rifle"

[ammo]
magazine = 8
reserve = 120
give = 120

[fire]
auto = false
time = 0.135
damage = 105
spread = 2.0
ads_spread = 0.3

[animations]
idle = "viewmodel_m1garand_idle"
empty_idle = "viewmodel_m1garand_empty_idle"
fire = "viewmodel_m1garand_fire"
last_fire = "viewmodel_m1garand_lastfire"
ads_fire = "viewmodel_m1garand_ads_fire"
ads_last_fire = "viewmodel_m1garand_ads_lastfire"
reload = "viewmodel_m1garand_partial_reload"
reload_empty = "viewmodel_m1garand_reload"
raise = "viewmodel_m1garand_pullout"
first_raise = "viewmodel_m1garand_first_pullout"
drop = "viewmodel_m1garand_putaway"
ads_up = "viewmodel_m1garand_ads_up"
ads_down = "viewmodel_m1garand_ads_down"

[sounds]
fire = "weap_m1garand_fire_plr"
last_fire = "weap_m1garand_lastshot_plr"
eject = "weap_m1garand_clip_plr"
dry = "dryfire_rifle_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"

[view]
ads_fov = 50
