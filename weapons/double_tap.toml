# Double Tap Root Beer: Der Riese's zombie_perk_bottle_doubletap, drunk as the game drinks it. The map's own machine
# sells it (its drink is the class <prefix>_DoubleTapDrink).
name = "Double Tap Root Beer"
class = "DoubleTap"
sprite = "DT"
kind = "drink"
perk = "DoubleTap"

[game]
weapon = "zombie_perk_bottle_doubletap"
models = ["viewmodel_hands", "zombie_perk_bottle_doubletap"]
world = "zombie_3rd_perk_bottle_doubletap"

[fire]
time = 2

[animations]
idle = "viewmodel_zombie_perksacola_idle"
raise = "viewmodel_zombie_perksacola_drink"
drop = "viewmodel_zombie_perksacola_lower"
