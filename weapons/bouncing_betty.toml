# Bouncing Betty: Der Riese's mine_bouncing_betty. Equipment: planted on the floor, it jumps and
# goes off when a zombie comes close. Players carrying it get two more every round, up to two.
name = "Bouncing Betty"
class = "BouncingBetty"
sprite = "BB"
kind = "mine"
slot = 8
wall = { cost = 1000, chalk = "bouncing_betty_chalk_c", scale = 0.25 }

[game]
weapon = "mine_bouncing_betty"
models = ["viewmodel_hands", "viewmodel_bbetty_mine"]
world = "weapon_bbetty_mine"

[ammo]
magazine = 2
give = 2
# two more every round, up to two
round = 2

[fire]
time = 1
damage = 600
splash = 200

[animations]
idle = "viewmodel_bbetty_idle"
empty_idle = "viewmodel_bbetty_empty_idle"
fire = "viewmodel_bbetty_fire"
# held before it is planted: its pin pulled (in the game, but unused there)
hold_fire = "viewmodel_bbetty_holdfire"
raise = "viewmodel_bbetty_raise"
drop = "viewmodel_bbetty_drop"

[sounds]
raise = "weap_raise_plr"
drop = "weap_putaway_plr"
