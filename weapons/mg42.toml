# MG42: Der Riese's zombie_mg42. Numbers are World at War's own,
# read from the running game (hell-hound list --kind weapon --json); damage is scaled by the map.
name = "MG42"
class = "Mg42"
sprite = "MG"
kind = "bullet"
slot = 5
upgrade = "mg42_upgraded"
box_weight = 1

[game]
weapon = "zombie_mg42"
models = ["viewmodel_hands", "viewmodel_zombie_mg42_mg"]
world = "weapon_zombie_mg42_mg"

[ammo]
magazine = 125
reserve = 375
give = 375

[fire]
auto = true
time = 0.064
damage = 130
spread = 4.0
ads_spread = 1.5

[animations]
idle = "viewmodel_mg42_idle"
empty_idle = "viewmodel_mg42_idle"
fire = "viewmodel_mg42_fire"
last_fire = "viewmodel_mg42_lastshot"
ads_fire = "viewmodel_mg42_ads_fire"
ads_last_fire = "viewmodel_mg42_ads_fire"
reload = "viewmodel_mg42_reload"
reload_empty = "viewmodel_mg42_reload_empty"
raise = "viewmodel_mg42_pullout"
first_raise = "viewmodel_mg42_pullout"
drop = "viewmodel_mg42_putaway"
ads_up = "viewmodel_mg42_ads_up"
ads_down = "viewmodel_mg42_ads_down"

[sounds]
fire = "weap_mg42_fire_plr"
last_fire = "weap_mg42_fire_plr"
dry = "dryfire_rifle_plr"
raise = "weap_raise_plr"
first_raise = "weap_raise_plr"
drop = "weap_putaway_plr"

[view]
ads_fov = 55
